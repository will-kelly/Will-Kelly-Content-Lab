[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "willkelly-content-lab"
version = "0.1.0"
description = "Evidence-first content quality and publishing gates"
requires-python = ">=3.10"
authors = [{name="Will Kelly"}]

[project.scripts]
wkq = "wkquality.cli:main"

[tool.setuptools.packages.find]
include = ["wkquality*"]
